      function getRankConfig(rankLevel = 1) {
        const level = Math.max(1, Math.min(15, Number(rankLevel) || 1));
        return RANKS.find(r => r.id === level) || RANKS[0];
      }

      // ========================================================
      // 2. CORE STREAK LOGIC
      // ========================================================
      const GOAL_DAYS_PER_RANK = 30;

      function getLocalDateString(dateObj = new Date()) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function addDaysToDateString(dateStr, daysToAdd) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const date = new Date(y, m - 1, d);
        date.setDate(date.getDate() + daysToAdd);
        return getLocalDateString(date);
      }

      function getDaysDiff(dateStr1, dateStr2) {
        const [y1, m1, d1] = dateStr1.split('-').map(Number);
        const [y2, m2, d2] = dateStr2.split('-').map(Number);
        const t1 = new Date(y1, m1 - 1, d1).getTime();
        const t2 = new Date(y2, m2 - 1, d2).getTime();
        return Math.round((t2 - t1) / (1000 * 60 * 60 * 24));
      }

      function getRecoveryStatus(history = [], todayStr = getLocalDateString()) {
        if (!history || history.length === 0) return { isRecovery: false, recoveryDaysLeft: 0, lastMissedDate: null };
        const sorted = [...history].sort((a, b) => a.date.localeCompare(b.date));
        const missedEntries = sorted.filter(item => item.status === 'missed');
        if (missedEntries.length === 0) return { isRecovery: false, recoveryDaysLeft: 0, lastMissedDate: null };

        const lastMissed = missedEntries[missedEntries.length - 1];
        const diff = getDaysDiff(lastMissed.date, todayStr);

        if (diff === 1) return { isRecovery: true, recoveryDaysLeft: 2, lastMissedDate: lastMissed.date };
        if (diff === 2) return { isRecovery: true, recoveryDaysLeft: 1, lastMissedDate: lastMissed.date };
        return { isRecovery: false, recoveryDaysLeft: 0, lastMissedDate: null };
      }

      function evaluateMissedDays(history = [], createdDateStr = getLocalDateString(), todayStr = getLocalDateString()) {
        if (!history || history.length === 0) return [];
        const updatedHistory = [...history];
        const historyMap = new Map(updatedHistory.map(item => [item.date, item]));
        let startDate = createdDateStr;
        if (updatedHistory.length > 0) {
          const earliest = [...updatedHistory].sort((a, b) => a.date.localeCompare(b.date))[0].date;
          if (earliest < startDate) startDate = earliest;
        }
        let curr = startDate;
        while (curr < todayStr) {
          if (!historyMap.has(curr)) {
            const rec = getRecoveryStatus(updatedHistory, curr);
            const entry = { date: curr, status: rec.isRecovery ? 'void_recovery' : 'missed', checked_in_at: null, autoGenerated: true };
            updatedHistory.push(entry);
            historyMap.set(curr, entry);
          }
          curr = addDaysToDateString(curr, 1);
        }
        return updatedHistory.sort((a, b) => a.date.localeCompare(b.date));
      }

      function executeCheckIn(state, todayStr = getLocalDateString()) {
        const { history = [], current_streak_days = 0, days_this_month = 0, current_rank = 1 } = state;
        const evaluatedHistory = evaluateMissedDays(history, state.created_at || todayStr, todayStr);
        const existingToday = evaluatedHistory.find(h => h.date === todayStr);

        if (existingToday && existingToday.checked_in_at) return { ...state, alreadyCheckedIn: true };

        const recoveryInfo = getRecoveryStatus(evaluatedHistory, todayStr);
        const status = recoveryInfo.isRecovery ? 'void_recovery' : 'counted';

        const newEntry = { date: todayStr, status, checked_in_at: new Date().toISOString() };
        const updatedHistory = evaluatedHistory.filter(h => h.date !== todayStr);
        updatedHistory.push(newEntry);
        updatedHistory.sort((a, b) => a.date.localeCompare(b.date));

        let newStreak = current_streak_days;
        let newMonthDays = days_this_month;
        let newRank = current_rank;

        if (status === 'counted') {
          newStreak += 1;
          newMonthDays += 1;
          if (newMonthDays >= GOAL_DAYS_PER_RANK) {
            if (newRank < 15) newRank += 1;
            newMonthDays = 0;
          }
        }

        return {
          ...state,
          history: updatedHistory,
          current_streak_days: newStreak,
          days_this_month: newMonthDays,
          current_rank: newRank,
          lastCheckInStatus: status
        };
      }

      function getMonthCalendarGrid(year, month, history = []) {
        const historyMap = new Map(history.map(h => [h.date, h]));
        const firstDayOfMonth = new Date(year, month - 1, 1);
        const daysInMonth = new Date(year, month, 0).getDate();
        const startingDayOfWeek = firstDayOfMonth.getDay();
        const todayStr = getLocalDateString();
        const grid = [];

        for (let i = 0; i < startingDayOfWeek; i++) grid.push({ isBlank: true, id: `blank-${i}` });
        for (let day = 1; day <= daysInMonth; day++) {
          const dStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const checkin = historyMap.get(dStr);
          grid.push({
            dateStr: dStr, dayNumber: day, status: checkin ? checkin.status : 'none',
            isCheckedIn: Boolean(checkin && checkin.checked_in_at), isToday: dStr === todayStr, isFuture: dStr > todayStr, isBlank: false
          });
        }
        return grid;
      }

      // ========================================================
      // 3. STORAGE & CLOUD REAL-TIME OVER-THE-INTERNET SYNC
      // ========================================================
      const STORAGE_KEY = 'rankstreak_app_data_v10';
      const MASTER_ADMIN_KEY = 'themenaretuff';
      const SYNC_CHANNEL_NAME = 'rankstreak_realtime_sync_v4';
      const CLOUD_SYNC_URL = 'https://api.restful-api.dev/objects/rankstreak_themenaretuff_app_v10';

      const INITIAL_DEMO_DATA = {
        adminKey: MASTER_ADMIN_KEY,
        activeUserId: null,
        accessRequests: {
          'themenaretuff': { id: 'themenaretuff', username: 'Administrator', status: 'approved', isAdmin: true }
        },
        users: {
          'themenaretuff': {
            id: 'themenaretuff',
            username: 'Administrator',
            shareId: 'themenaretuff',
            current_rank: 1, // Day 1 Start
            current_streak_days: 0,
            days_this_month: 0,
            created_at: getLocalDateString(),
            history: [],
            isAdmin: true
          }
        },
        followedUserIds: []
      };

      function loadAppState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return INITIAL_DEMO_DATA;
          const parsed = JSON.parse(raw);
          return {
            ...INITIAL_DEMO_DATA,
            ...parsed,
            accessRequests: { ...INITIAL_DEMO_DATA.accessRequests, ...(parsed.accessRequests || {}) },
            users: { ...INITIAL_DEMO_DATA.users, ...(parsed.users || {}) }
          };
        } catch (e) {
          return INITIAL_DEMO_DATA;
        }
      }

      function saveAppState(state, pushCloud = true) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (window.BroadcastChannel) {
            const bc = new BroadcastChannel(SYNC_CHANNEL_NAME);
            bc.postMessage({ type: 'STATE_UPDATED', state });
            bc.close();
          }
        } catch (e) {}

        if (pushCloud) {
          syncToCloudServer(state);
        }
      }

      let isSyncingToCloud = false;
      async function syncToCloudServer(state) {
        if (isSyncingToCloud) return;
        isSyncingToCloud = true;
        try {
          const payload = {
            id: 'rankstreak_themenaretuff_app_v10',
            name: 'RankStreak Global Cloud Data',
            data: {
              accessRequests: state.accessRequests,
              users: state.users,
              followedUserIds: state.followedUserIds,
              updatedAt: new Date().toISOString()
            }
          };

          const res = await fetch(CLOUD_SYNC_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            await fetch('https://api.restful-api.dev/objects', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          }
        } catch (e) {}
        isSyncingToCloud = false;
      }

      async function fetchFromCloudServer() {
        try {
          const res = await fetch(CLOUD_SYNC_URL, {
            headers: { 'Cache-Control': 'no-cache' }
          });
          if (res.ok) {
            const json = await res.json();
            if (json && json.data && json.data.accessRequests) {
              return json.data;
            }
          }
        } catch (e) {}
        return null;
      }

      // ========================================================
      // 4. OBSIDIAN THEME CANVAS
      // ========================================================
      function ObsidianThemeCanvas({ currentRank = 1 }) {
        const canvasRef = useRef(null);
        const animRef = useRef(null);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let w = canvas.width = window.innerWidth;
          let h = canvas.height = window.innerHeight;

          const rankConfig = getRankConfig(currentRank);
          const veinColor = rankConfig.veinColor;
          const accentHex = rankConfig.accentHex;
          const effect = rankConfig.effect;
          const veinWidth = rankConfig.veinWidth || 2;

          const generateVeinBranches = (width, height, rank) => {
            const branches = [];
            const count = 6 + (rank % 4);
            for (let i = 0; i < count; i++) {
              let x = (0.15 + (i * 0.14) + Math.sin(i * 1.7) * 0.08) * width;
              let y = (0.2 + (i % 3) * 0.3) * height;
              let angle = (i * 0.9) % (Math.PI * 2);
              const segments = [];
              let len = 120 + (i % 3) * 80;
              for (let s = 0; s < 7; s++) {
                const nx = x + Math.cos(angle) * (len / 7);
                const ny = y + Math.sin(angle) * (len / 7);
                segments.push({ x1: x, y1: y, x2: nx, y2: ny });
                if (s > 1 && s % 2 === 0) {
                  const subAngle = angle + (s % 2 === 0 ? 0.7 : -0.7);
                  segments.push({ x1: nx, y1: ny, x2: nx + Math.cos(subAngle) * 45, y2: ny + Math.sin(subAngle) * 45 });
                }
                x = nx; y = ny; angle += (Math.sin(s + i) * 0.4);
              }
              branches.push(segments);
            }
            return branches;
          };

          let veins = generateVeinBranches(w, h, currentRank);
          const particles = [];
          const numParticles = effect === 'stealth_dark' ? 5 : (effect === 'starfield_nebula' ? 90 : 35);
          for (let p = 0; p < numParticles; p++) {
            particles.push({
              x: Math.random() * w, y: Math.random() * h,
              vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.8 - (effect === 'ember_sparks' ? 0.8 : 0),
              size: Math.random() * 2.5 + 1, alpha: Math.random() * 0.8 + 0.2, phase: Math.random() * Math.PI * 2
            });
          }

          let frame = 0;
          const render = () => {
            frame++;
            ctx.clearRect(0, 0, w, h);
            const bgGrad = ctx.createRadialGradient(w/2, h/3, 50, w/2, h/2, Math.max(w, h));
            bgGrad.addColorStop(0, rankConfig.bgGradient.match(/#[a-fA-F0-9]{6}/g)?.[0] || '#061f12');
            bgGrad.addColorStop(0.6, rankConfig.bgGradient.match(/#[a-fA-F0-9]{6}/g)?.[1] || '#030a06');
            bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            const pulse = Math.sin(frame * 0.03) * 0.25 + 0.75;
            let flicker = 1.0;
            if (effect === 'lightning_flicker' && Math.random() > 0.94) flicker = 1.8 + Math.random() * 0.5;

            ctx.save();
            ctx.shadowColor = veinColor;
            ctx.shadowBlur = (currentRank === 14 ? 3 : 14 * pulse * flicker);
            ctx.strokeStyle = veinColor;
            ctx.lineWidth = veinWidth * (currentRank === 14 ? 0.7 : 1);
            ctx.globalAlpha = currentRank === 14 ? 0.25 : 0.8 * pulse;

            veins.forEach(b => {
              ctx.beginPath();
              b.forEach(s => { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); });
              ctx.stroke();
            });
            ctx.restore();

            particles.forEach(p => {
              p.x += p.vx; p.y += p.vy; p.phase += 0.02;
              if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
              if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;

              ctx.save();
              ctx.globalAlpha = Math.abs(Math.sin(p.phase)) * p.alpha * (currentRank === 14 ? 0.2 : 1);
              ctx.fillStyle = effect === 'ember_sparks' ? '#FF7700' : (effect === 'starfield_nebula' ? '#C084FC' : accentHex);
              ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
              ctx.restore();
            });

            animRef.current = requestAnimationFrame(render);
          };
          render();

          const handleResize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; veins = generateVeinBranches(w, h, currentRank); };
          window.addEventListener('resize', handleResize);
          return () => { window.removeEventListener('resize', handleResize); if (animRef.current) cancelAnimationFrame(animRef.current); };
        }, [currentRank]);

        return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 transition-opacity duration-1000" />;
      }

      // ========================================================
      // 5. RANK BADGE COMPONENT
      // ========================================================
      function RankBadge({ rank = 1, size = 'md', showTitle = true }) {
        const config = getRankConfig(rank);
        const accent = config.accentHex;
        const sizeMap = {
          sm: { box: 'w-10 h-10', text: 'text-xs' },
          md: { box: 'w-16 h-16', text: 'text-base' },
          lg: { box: 'w-24 h-24', text: 'text-xl' }
        };
        const dim = sizeMap[size] || sizeMap.md;

        return (
          <div className="flex flex-col items-center justify-center group">
            <div className={`relative ${dim.box} flex items-center justify-center transition-transform group-hover:scale-105`}>
              <div className="absolute inset-0 rounded-full blur-md opacity-60" style={{ backgroundColor: accent }} />
              <svg className="absolute inset-0 w-full h-full drop-shadow-lg" viewBox="0 0 100 100">

      // ========================================================
      // 6. CHECK-IN BUTTON COMPONENT
      // ========================================================
      function CheckInButton({ isCheckedInToday, isRecovery, recoveryDaysLeft, currentRank, onCheckIn, readOnly }) {
        const [isPressing, setIsPressing] = useState(false);
        const rankConfig = getRankConfig(currentRank);
        const accent = rankConfig.accentHex;

        const playChime = () => {
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(440 + currentRank * 20, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880 + currentRank * 30, ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.start(); osc.stop(ctx.currentTime + 0.4);
          } catch(e) {}
        };

        const handleClick = () => {
          if (isCheckedInToday || readOnly) return;
          setIsPressing(true);
          playChime();
          if (navigator.vibrate) navigator.vibrate(100);
          setTimeout(() => { setIsPressing(false); onCheckIn(); }, 200);
        };

        return (
          <div className="flex flex-col items-center justify-center my-6">
            <div className="relative group">
              <div
                className={`absolute -inset-4 rounded-full blur-xl transition-all duration-700 opacity-60 ${
                  isCheckedInToday ? 'bg-emerald-500 opacity-40' : isRecovery ? 'bg-amber-500 animate-pulse' : 'animate-pulse'
                }`}
                style={{ backgroundColor: isCheckedInToday ? undefined : isRecovery ? undefined : accent }}
              />
              <button
                onClick={handleClick}
                disabled={isCheckedInToday || readOnly}
                className={`relative z-10 w-48 h-48 sm:w-56 sm:h-56 rounded-full border-4 flex flex-col items-center justify-center text-center p-4 transition-all duration-300 transform shadow-2xl backdrop-blur-md ${
                  isPressing ? 'scale-95' : 'hover:scale-105 active:scale-95'
                } ${
                  isCheckedInToday
                    ? 'bg-emerald-950/80 border-emerald-500 text-emerald-300 cursor-default'
                    : isRecovery
                    ? 'bg-amber-950/80 border-amber-500 text-amber-300'
                    : 'bg-black/80 text-white hover:brightness-110'
                }`}
                style={{ borderColor: isCheckedInToday ? '#10B981' : isRecovery ? '#F59E0B' : accent }}
              >
                {isCheckedInToday ? (
                  <>
                    <span className="text-4xl mb-2">✓</span>
                    <span className="text-lg font-black tracking-wide font-mono">CHECKED IN</span>
                    <span className="text-xs text-emerald-300/80 mt-1">Day Complete</span>
                  </>
                ) : isRecovery ? (
                  <>
                    <span className="text-4xl mb-2 text-amber-400">⚠️</span>
                    <span className="text-base font-black tracking-wider text-amber-300">RECOVERY CHECK-IN</span>
                    <span className="text-xs text-amber-200/70 mt-1 font-mono">Void ({recoveryDaysLeft}d left)</span>
                  </>
                ) : (
                  <>
                    <span className="text-5xl mb-2" style={{ color: accent }}>🔥</span>
                    <span className="text-xl font-black tracking-widest font-mono uppercase">CHECK IN</span>
                    <span className="text-xs opacity-75 mt-1 font-sans">Tap once for Day +1</span>
                  </>
                )}
              </button>
            </div>
            {readOnly && <span className="mt-3 text-xs font-mono text-slate-400 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-700">🔒 Read-Only Viewer Mode</span>}
          </div>
        );
      }

      function ProgressRing({ daysThisMonth = 0, currentRank = 1 }) {
        const rankConfig = getRankConfig(currentRank);
        const accent = rankConfig.accentHex;
        const radius = 54; const circumference = 2 * Math.PI * radius;
        const percentage = Math.min(100, Math.max(0, (daysThisMonth / 30) * 100));
        const strokeDashoffset = circumference - (percentage / 100) * circumference;

        return (
          <div className="relative flex flex-col items-center justify-center">
            <svg className="w-36 h-36 transform -rotate-90 drop-shadow-lg" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r={radius} fill="none" stroke="#1F2937" strokeWidth="8" />
              <circle cx="60" cy="60" r={radius} fill="none" stroke={accent} strokeWidth="8"
                      strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} strokeLinecap="round" className="transition-all duration-700" />
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center text-center z-10">
              <span className="text-2xl font-black font-mono tracking-tight text-white">{daysThisMonth}<span className="text-xs text-slate-400 font-normal">/30</span></span>
              <span className="text-[10px] uppercase font-bold tracking-widest text-slate-400 mt-0.5">Days This Rank</span>
            </div>
          </div>

      // ========================================================
      // 8. ADMINISTRATOR ACCESS GATE & APPROVAL CONTROL MODAL
      // ========================================================
      function AdminControlModal({ appState, setAppState, onClose }) {
        const [newCustomId, setNewCustomId] = useState('');
        const [generatedMsg, setGeneratedMsg] = useState('');
        const [isRefreshing, setIsRefreshing] = useState(false);

        const accessRequests = appState.accessRequests || {};

        const handleManualCloudFetch = async () => {
          setIsRefreshing(true);
          const cloudData = await fetchFromCloudServer();
          if (cloudData && cloudData.accessRequests) {
            setAppState(prev => {
              const merged = { ...prev.accessRequests, ...cloudData.accessRequests };
              const newState = { ...prev, accessRequests: merged };
              saveAppState(newState, false);
              return newState;
            });
            setGeneratedMsg('✓ Synced latest user access requests from Cloud!');
          } else {
            setGeneratedMsg('Checked Cloud: No new pending requests yet.');
          }
          setIsRefreshing(false);
        };

        const handleApprove = (id) => {
          setAppState(prev => {
            const req = prev.accessRequests[id] || { id, username: 'Member', status: 'pending' };
            const updatedReqs = { ...prev.accessRequests, [id]: { ...req, status: 'approved' } };
            
            const existingUser = prev.users[id] || {
              id,
              username: req.username || `Member_${id.slice(-4)}`,
              shareId: id,
              current_rank: 1,
              current_streak_days: 0,
              days_this_month: 0,
              created_at: getLocalDateString(),
              history: []
            };

            const newState = {
              ...prev,
              accessRequests: updatedReqs,
              users: { ...prev.users, [id]: existingUser }
            };
            saveAppState(newState);
            return newState;
          });
        };

        const handleDeny = (id) => {
          setAppState(prev => {
            const updatedReqs = { ...prev.accessRequests };
            delete updatedReqs[id];
            const newState = { ...prev, accessRequests: updatedReqs };
            saveAppState(newState);
            return newState;
          });
        };

        const handleGenerateNewId = (e) => {
          e.preventDefault();
          const newId = newCustomId.trim() || `USER-${Math.floor(1000 + Math.random() * 9000)}-JOIN`;
          setAppState(prev => {
            const newState = {
              ...prev,
              accessRequests: {
                ...prev.accessRequests,
                [newId]: { id: newId, username: '', status: 'approved', createdAt: getLocalDateString() }
              }
            };
            saveAppState(newState);
            return newState;
          });
          setGeneratedMsg(`Created & Approved Access ID: ${newId}`);
          setNewCustomId('');
        };

        const handleSimulateIncomingRequest = () => {
          const simId = `USER-${Math.floor(1000 + Math.random() * 9000)}-JOIN`;
          setAppState(prev => {
            const newState = {
              ...prev,
              accessRequests: {
                ...prev.accessRequests,
                [simId]: { id: simId, username: '', status: 'pending', createdAt: getLocalDateString() }
              }
            };
            saveAppState(newState);
            return newState;
          });
          setGeneratedMsg(`Simulated incoming request from: ${simId}`);
        };

        const sortedRequests = Object.values(accessRequests).sort((a, b) => {
          if (a.status === 'pending' && b.status !== 'pending') return -1;
          if (a.status !== 'pending' && b.status === 'pending') return 1;
          return 0;
        });

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl animate-fadeIn text-left text-slate-100 font-mono">
            <div className="relative w-full max-w-xl p-6 rounded-3xl bg-slate-950 border border-amber-500/60 shadow-2xl space-y-5">
              <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                <div className="flex items-center gap-2 text-amber-400 font-black tracking-wider text-lg">
                  <span>👑 ADMINISTRATOR CONTROL DASHBOARD</span>
                </div>
                <button onClick={onClose} className="px-3 py-1 bg-slate-900 hover:bg-slate-800 rounded-lg border border-slate-700 text-xs">CLOSE</button>
              </div>

              {/* Generate ID Form & Simulation */}
              <div className="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-3">
                <span className="text-xs font-bold text-amber-300 block">CREATE ACCESS ID OR TEST INCOMING REQUEST</span>
                <form onSubmit={handleGenerateNewId} className="flex gap-2">
                  <input
                    type="text"
                    placeholder="Enter custom user ID to create/approve (e.g. USER-77)"
                    value={newCustomId}
                    onChange={e => setNewCustomId(e.target.value)}
                    className="flex-1 bg-black border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                  />
                  <button type="submit" className="bg-amber-500 hover:bg-amber-400 text-black font-bold px-3 py-2 rounded-lg text-xs whitespace-nowrap">
                    + APPROVE / CREATE ID
                  </button>
                </form>

                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={handleManualCloudFetch}
                    disabled={isRefreshing}
                    className="flex-1 py-2 bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-500/60 text-cyan-300 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2"
                  >
                    <span>{isRefreshing ? '🔄 SYNCING...' : '🔄 REFRESH CLOUD REQUESTS'}</span>
                  </button>
                  <button
                    type="button"
                    onClick={handleSimulateIncomingRequest}
                    className="flex-1 py-2 bg-amber-950/60 hover:bg-amber-900 border border-amber-500/60 text-amber-300 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2"
                  >
                    <span>⚡ TEST SIMULATE REQUEST</span>
                  </button>
                </div>

                {generatedMsg && <p className="text-xs text-emerald-400 font-bold">{generatedMsg}</p>}
              </div>

              {/* Access Requests List */}
              <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                <span className="text-xs font-bold text-slate-400 block uppercase">All Access IDs & Pending User Requests</span>
                {sortedRequests.length === 0 ? (
                  <p className="text-xs text-slate-500 p-4 text-center">No access requests recorded yet.</p>
                ) : (
                  sortedRequests.map(req => (
                    <div key={req.id} className={`p-3 rounded-xl border flex items-center justify-between text-xs ${req.status === 'pending' ? 'bg-amber-950/80 border-amber-500 animate-pulse shadow-md shadow-amber-500/20' : 'bg-slate-900/80 border-slate-800'}`}>
                      <div>
                        <span className="font-bold text-cyan-300 block">{req.id} {req.isAdmin ? '(Administrator)' : ''}</span>
                        <span className="text-slate-400 text-[10px]">
                          Name: {req.username || 'Not set yet'} | Status: <strong className={req.status === 'pending' ? 'text-amber-400 font-bold' : 'text-emerald-400'}>{req.status.toUpperCase()}</strong>
                        </span>
                      </div>

                      <div className="flex gap-2">
                        {req.status === 'pending' ? (
                          <>
                            <button onClick={() => handleApprove(req.id)} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-1.5 rounded shadow-lg text-xs">ALLOW</button>
                            <button onClick={() => handleDeny(req.id)} className="bg-rose-600 hover:bg-rose-500 text-white font-bold px-3 py-1.5 rounded shadow text-xs">DENY</button>
                          </>
                        ) : (
                          <span className="bg-emerald-950 border border-emerald-600 text-emerald-400 px-2 py-1 rounded font-bold text-[10px]">APPROVED</span>
                        )}
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        );
      }

      function AccessGate({ appState, setAppState, onAccessGranted }) {
        const [accessIdInput, setAccessIdInput] = useState('');
        const [nameInput, setNameInput] = useState('');
        const [error, setError] = useState('');
        const [step, setStep] = useState('enter_id');
        const [activeAccessId, setActiveAccessId] = useState('');

        const handleAccessSubmit = (e) => {
          e.preventDefault();
          setError('');
          const rawId = accessIdInput.trim();
          if (!rawId) return;

          if (rawId.toLowerCase() === MASTER_ADMIN_KEY.toLowerCase()) {
            onAccessGranted(MASTER_ADMIN_KEY);
            return;
          }

          const existingReq = appState.accessRequests?.[rawId];

          if (!existingReq) {
            setAppState(prev => {
              const newState = {
                ...prev,
                accessRequests: {
                  ...prev.accessRequests,
                  [rawId]: { id: rawId, username: '', status: 'pending', createdAt: getLocalDateString() }
                }
              };
              saveAppState(newState);
              return newState;
            });
            setActiveAccessId(rawId);
            setStep('pending');
          } else if (existingReq.status === 'pending') {
            setActiveAccessId(rawId);
            setStep('pending');
          } else if (existingReq.status === 'approved') {
            setActiveAccessId(rawId);
            if (existingReq.username) {
              onAccessGranted(rawId);
            } else {
              setStep('enter_name');
            }
          }
        };

        const handleNameSubmit = (e) => {
          e.preventDefault();
          const trimmedName = nameInput.trim();
          if (!trimmedName) return;

          setAppState(prev => {
            const updatedReqs = {
              ...prev.accessRequests,
              [activeAccessId]: { ...prev.accessRequests[activeAccessId], username: trimmedName, status: 'approved' }
            };

            const newUser = {
              id: activeAccessId,
              username: trimmedName,
              shareId: activeAccessId,
              current_rank: 1,
              current_streak_days: 0,
              days_this_month: 0,
              created_at: getLocalDateString(),
              history: []
            };

            const newState = {
              ...prev,
              accessRequests: updatedReqs,
              users: { ...prev.users, [activeAccessId]: newUser }
            };
            saveAppState(newState);
            return newState;
          });

          onAccessGranted(activeAccessId);
        };

        useEffect(() => {
          if (step === 'pending' && activeAccessId) {
            const interval = setInterval(async () => {
              const req = appState.accessRequests?.[activeAccessId];
              if (req && req.status === 'approved') {
                if (req.username) {
                  onAccessGranted(activeAccessId);
                } else {
                  setStep('enter_name');
                }
                return;
              }

              const cloudData = await fetchFromCloudServer();
              if (cloudData && cloudData.accessRequests) {
                const cloudReq = cloudData.accessRequests[activeAccessId];
                if (cloudReq && cloudReq.status === 'approved') {
                  setAppState(prev => ({
                    ...prev,
                    accessRequests: { ...prev.accessRequests, [activeAccessId]: cloudReq }
                  }));
                  if (cloudReq.username) {
                    onAccessGranted(activeAccessId);
                  } else {
                    setStep('enter_name');
                  }
                }
              }
            }, 1200);
            return () => clearInterval(interval);
          }
        }, [step, activeAccessId, appState.accessRequests]);

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/95 backdrop-blur-2xl text-slate-100 font-mono animate-fadeIn">
            <div className="relative w-full max-w-md p-6 sm:p-8 rounded-3xl bg-slate-950 border-2 border-cyan-500/60 shadow-2xl text-center space-y-6">
              
              <div className="inline-flex p-4 rounded-2xl bg-cyan-950/80 border border-cyan-500/40 text-cyan-400">
                <span className="text-4xl">🔐</span>
              </div>

              <div>
                <h2 className="text-2xl font-black tracking-wider uppercase text-white">RankStreak Gate</h2>
                <p className="text-xs text-slate-400 mt-1">Administrator Approval Required to Enter App</p>
              </div>

              {step === 'enter_id' && (
                <form onSubmit={handleAccessSubmit} className="space-y-4">
                  <div>
                    <label className="text-[10px] text-slate-400 uppercase font-bold block mb-1">Enter Access ID or Create a Request ID</label>
                    <input
                      type="text"
                      required
                      placeholder="Type your ID or any requested ID (e.g. USER-77)"
                      value={accessIdInput}
                      onChange={e => setAccessIdInput(e.target.value)}
                      className="w-full bg-black border border-slate-700 rounded-xl px-4 py-3 text-sm text-cyan-300 font-bold tracking-wider text-center focus:outline-none focus:border-cyan-400"
                    />
                  </div>

                  {error && <p className="text-xs text-rose-400">{error}</p>}

                  <button type="submit" className="w-full py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-sm tracking-wider uppercase shadow-xl transition-all">
                    SUBMIT & REQUEST ACCESS
                  </button>

                  <p className="text-[10px] text-slate-500 text-center mt-2">Type any ID above to send a real-time approval request to the Administrator. Once approved in the Admin Panel, your ID will be activated permanently!</p>
                </form>
              )}

              {step === 'pending' && (
                <div className="p-5 rounded-2xl bg-amber-950/60 border border-amber-500/60 space-y-3 animate-pulse">
                  <span className="text-3xl">⏳</span>
                  <h3 className="text-sm font-bold text-amber-200">WAITING FOR ADMINISTRATOR APPROVAL</h3>
                  <p className="text-xs text-amber-300/80">
                    Your Access ID: <strong className="text-white underline">{activeAccessId}</strong>
                  </p>
                  <p className="text-[11px] text-slate-400">The Administrator must click "ALLOW" in their panel. This screen will automatically update when approved!</p>
                </div>
              )}

              {step === 'enter_name' && (
                <form onSubmit={handleNameSubmit} className="space-y-4 animate-fadeIn">
                  <div className="p-3 rounded-xl bg-emerald-950/60 border border-emerald-500/60 text-emerald-300 text-xs font-bold">
                    ✓ Access Approved by Administrator!
                  </div>

                  <div>
                    <label className="text-[10px] text-slate-400 uppercase font-bold block mb-1">Enter Your Display Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Alex Smith"
                      value={nameInput}
                      onChange={e => setNameInput(e.target.value)}
                      className="w-full bg-black border border-slate-700 rounded-xl px-4 py-3 text-sm text-white font-bold text-center focus:outline-none focus:border-emerald-400"
                    />
                  </div>

                  <button type="submit" className="w-full py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm tracking-wider uppercase shadow-xl transition-all">
                    ENTER RANKSTREAK (DAY 1)
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // ========================================================
      // 9. MAIN APP COMPONENT WITH REAL-TIME ADMIN POLL
      // ========================================================
      function App() {
        const [appState, setAppState] = useState(() => loadAppState());
        const [activeTab, setActiveTab] = useState('home');
        const [viewingFriendId, setViewingFriendId] = useState(null);
        const [transitionEvent, setTransitionEvent] = useState(null);
        const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);

        // Auto Save
        useEffect(() => { saveAppState(appState); }, [appState]);

        // REAL-TIME AUTO POLL & BroadcastChannel Across Tabs & Windows
        useEffect(() => {
          const handleStorageChange = (e) => {
            if (e.key === STORAGE_KEY && e.newValue) {
              try {
                const fresh = JSON.parse(e.newValue);
                setAppState(prev => ({
                  ...prev,
                  accessRequests: fresh.accessRequests,
                  users: fresh.users
                }));
              } catch (err) {}
            }
          };

          window.addEventListener('storage', handleStorageChange);

          let bc;
          if (window.BroadcastChannel) {
            try {
              bc = new BroadcastChannel(SYNC_CHANNEL_NAME);
              bc.onmessage = (event) => {
                if (event.data && event.data.state) {
                  const fresh = event.data.state;
                  setAppState(prev => ({
                    ...prev,
                    accessRequests: fresh.accessRequests,
                    users: fresh.users
                  }));
                }
              };
            } catch (err) {}
          }

          const interval = setInterval(async () => {
            const fresh = loadAppState();
            setAppState(prev => {
              if (JSON.stringify(prev.accessRequests) !== JSON.stringify(fresh.accessRequests)) {
                return {
                  ...prev,
                  accessRequests: fresh.accessRequests,
                  users: fresh.users
                };
              }
              return prev;
            });

            const cloudData = await fetchFromCloudServer();
            if (cloudData && cloudData.accessRequests) {
              setAppState(prev => {
                const mergedReqs = { ...prev.accessRequests, ...cloudData.accessRequests };
                const mergedUsers = { ...prev.users, ...cloudData.users };
                const mergedFollowed = Array.from(new Set([...(prev.followedUserIds || []), ...(cloudData.followedUserIds || [])]));

                if (JSON.stringify(prev.accessRequests) !== JSON.stringify(mergedReqs) ||
                    JSON.stringify(prev.users) !== JSON.stringify(mergedUsers)) {
                  const newState = {
                    ...prev,
                    accessRequests: mergedReqs,
                    users: mergedUsers,
                    followedUserIds: mergedFollowed
                  };
                  saveAppState(newState, false);
                  return newState;
                }
                return prev;
              });
            }
          }, 1500);

          return () => {
            window.removeEventListener('storage', handleStorageChange);
            if (bc) bc.close();
            clearInterval(interval);
          };
        }, []);

        const activeUserId = appState.activeUserId;
        const currentUser = appState.users[activeUserId];
        
        const isAdmin = Boolean(
          activeUserId && activeUserId.trim().toLowerCase() === MASTER_ADMIN_KEY.toLowerCase()
        );

        // Count pending requests for Admin Notification Badge
        const pendingRequestsList = Object.values(appState.accessRequests || {}).filter(
          r => r.status === 'pending'
        );
        const pendingCount = pendingRequestsList.length;

        const handleAccessGranted = (grantedUserId) => {
          setAppState(prev => ({
            ...prev,
            activeUserId: grantedUserId
          }));
        };

        const handleCheckIn = () => {
          if (!currentUser) return;
          const todayStr = getLocalDateString();
          const oldRank = currentUser.current_rank;
          const updatedUser = executeCheckIn(currentUser, todayStr);
          setAppState(prev => ({ ...prev, users: { ...prev.users, [activeUserId]: updatedUser } }));
          if (updatedUser.current_rank !== oldRank) {
            setTransitionEvent({ type: updatedUser.current_rank > oldRank ? 'promoted' : 'demoted', oldRank, newRank: updatedUser.current_rank });
          }
        };

        const handleAddFriend = (fid) => {
          const currentF = appState.followedUserIds || [];
          if (!currentF.includes(fid)) setAppState(prev => ({ ...prev, followedUserIds: [...currentF, fid] }));
        };

        if (!activeUserId || !currentUser) {
          return <AccessGate appState={appState} setAppState={setAppState} onAccessGranted={handleAccessGranted} />;
        }

        if (viewingFriendId) {
          return <ReadOnlyFriendDashboard friendUser={appState.users[viewingFriendId]} onBack={() => setViewingFriendId(null)} />;
        }

        const todayStr = getLocalDateString();
        const history = currentUser?.history || [];
        const todayEntry = history.find(h => h.date === todayStr);
        const isCheckedInToday = Boolean(todayEntry && todayEntry.checked_in_at);
        const recoveryInfo = getRecoveryStatus(history, todayStr);
        const currentRank = currentUser?.current_rank || 1;
        const rankConfig = getRankConfig(currentRank);

        return (
          <div className="relative min-h-screen bg-black text-slate-100 font-sans pb-24 sm:pb-12">
            <ObsidianThemeCanvas currentRank={currentRank} />

            {/* Glowing Admin Pending Alert Banner */}
            {isAdmin && pendingCount > 0 && (
              <div
                onClick={() => setIsAdminModalOpen(true)}
                className="bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-black px-4 py-2 font-mono font-black text-xs text-center cursor-pointer flex items-center justify-center gap-2 animate-pulse shadow-lg relative z-40"
              >
                <span>🔔 ALERT: {pendingCount} NEW USER ID REQUEST{pendingCount > 1 ? 'S' : ''} RECEIVED ({pendingRequestsList.map(r => r.id).join(', ')})!</span>
                <span className="bg-black text-amber-300 px-2.5 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider">CLICK TO REVIEW & ALLOW ►</span>
              </div>
            )}

            {/* Top Navbar */}
            <header className="px-6 py-4 bg-black/80 backdrop-blur-md border-b border-slate-800 flex items-center justify-between relative z-30">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg flex items-center justify-center font-black font-mono text-black" style={{ backgroundColor: rankConfig.accentHex }}>R{currentRank}</div>
                <div className="text-left">
                  <h1 className="text-base font-black font-mono tracking-wider uppercase text-white flex items-center gap-2">
                    <span>RankStreak</span>
                    {isAdmin && <span className="text-[10px] font-mono bg-amber-500 text-black px-1.5 py-0.5 rounded font-bold">ADMIN</span>}
                  </h1>
                  <span className="text-[10px] font-mono text-slate-400 block -mt-1">{currentUser.username} • {rankConfig.name}</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <nav className="flex gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-mono font-bold">
                  <button onClick={() => setActiveTab('home')} className={`px-3 py-1.5 rounded-lg ${activeTab === 'home' ? 'bg-slate-800 text-white' : 'text-slate-400'}`}>Dashboard</button>
                  <button onClick={() => setActiveTab('calendar')} className={`px-3 py-1.5 rounded-lg ${activeTab === 'calendar' ? 'bg-slate-800 text-white' : 'text-slate-400'}`}>History</button>
                  <button onClick={() => setActiveTab('roadmap')} className={`px-3 py-1.5 rounded-lg ${activeTab === 'roadmap' ? 'bg-slate-800 text-white' : 'text-slate-400'}`}>Ranks</button>
                  <button onClick={() => setActiveTab('friends')} className={`px-3 py-1.5 rounded-lg ${activeTab === 'friends' ? 'bg-slate-800 text-white' : 'text-slate-400'}`}>Friends</button>
                </nav>

                {/* ADMIN PANEL BUTTON WITH REAL-TIME PENDING NOTIFICATION BADGE */}
                {isAdmin && (
                  <button
                    onClick={() => setIsAdminModalOpen(true)}
                    className={`text-xs font-mono font-bold px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 ${
                      pendingCount > 0
                        ? 'bg-amber-500 text-black animate-bounce shadow-lg shadow-amber-500/50'
                        : 'bg-amber-500/80 hover:bg-amber-400 text-black'
                    }`}
                  >
                    <span>👑 ADMIN PANEL</span>
                    {pendingCount > 0 && (
                      <span className="bg-black text-amber-400 px-1.5 py-0.5 rounded-full text-[10px]">
                        {pendingCount} PENDING
                      </span>
                    )}
                  </button>
                )}

                <button
                  onClick={() => setAppState(prev => ({ ...prev, activeUserId: null }))}
                  className="bg-slate-900 hover:bg-slate-800 text-slate-400 text-xs font-mono px-2.5 py-2 rounded-xl border border-slate-800"
                  title="Switch Access ID"
                >
                  🚪
                </button>
              </div>
            </header>

            {/* Content Area */}
            <main className="relative z-10 max-w-xl mx-auto px-4 pt-4 text-center">
              {activeTab === 'home' && (
                <div className="space-y-6">
                  <div className="flex flex-col items-center pt-2">
                    <RankBadge rank={currentRank} size="lg" showTitle={false} />
                    <h2 className="text-2xl font-black font-mono tracking-wider uppercase mt-2" style={{ color: rankConfig.accentHex }}>
                      R{currentRank} — {rankConfig.name}
                    </h2>
                    <span className="text-xs text-slate-400 font-mono">{rankConfig.backgroundTreatment}</span>
                  </div>

                  {recoveryInfo.isRecovery && (
                    <div className="p-3 rounded-xl bg-amber-950 border border-amber-500 text-amber-200 text-xs font-mono">
                      ⚠️ RECOVERY PERIOD ACTIVE: {recoveryInfo.recoveryDaysLeft} more day(s) before check-ins count toward rank!
                    </div>
                  )}

                  <CheckInButton isCheckedInToday={isCheckedInToday} isRecovery={recoveryInfo.isRecovery} recoveryDaysLeft={recoveryInfo.recoveryDaysLeft} currentRank={currentRank} onCheckIn={handleCheckIn} />

                  <div className="grid grid-cols-2 gap-3">
                    <div className="p-4 rounded-2xl bg-black/70 border border-slate-800">
                      <span className="text-3xl font-black font-mono text-white">{currentUser?.current_streak_days || 0}</span>
                      <span className="text-[10px] font-mono uppercase text-slate-400 block mt-1">Current Streak (Days)</span>
                    </div>
                    <div className="p-4 rounded-2xl bg-black/70 border border-slate-800 flex items-center justify-center">
                      <ProgressRing daysThisMonth={currentUser?.days_this_month || 0} currentRank={currentRank} />
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'calendar' && <CalendarView history={history} currentRank={currentRank} />}
              {activeTab === 'roadmap' && <RankRoadmap currentRank={currentRank} />}
              {activeTab === 'friends' && <FriendsView currentUser={currentUser} allUsersMap={appState.users} followedUserIds={appState.followedUserIds || []} onAddFriend={handleAddFriend} onViewFriendDashboard={id => setViewingFriendId(id)} />}
            </main>

            {transitionEvent && <RankTransitionOverlay eventType={transitionEvent.type} oldRank={transitionEvent.oldRank} newRank={transitionEvent.newRank} onClose={() => setTransitionEvent(null)} />}

            {isAdminModalOpen && isAdmin && <AdminControlModal appState={appState} setAppState={setAppState} onClose={() => setIsAdminModalOpen(false)} />}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
